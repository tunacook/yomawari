# Yomawari 検出ルール（DESIGN.md §10）
# 閾値・パターン・検出時の動作はここに置き、コードには書かない。
# 実装済みのルールだけを並べる。未実装のルールはフェーズごとに追加する。
#
# severity: critical | major | minor | info
# on_detect: restart（ゲームを止めて再起動し継続）| 省略（記録のみ）

version: 1

rules:
  - id: C-01
    severity: critical
    title: プロセスの異常終了
    description: ハーネスが終了させていないのにプロセスが消滅した、または終了コードが0以外
    on_detect: restart
    params:
      # ハーネスが送ったシグナルによる終了コード（負値はシグナル番号）は異常扱いしない
      harness_exit_codes: [0, -15, -9]

  - id: C-02
    severity: critical
    title: クラッシュダンプの出現
    description: 起動後にクラッシュダンプフォルダへゲームのダンプが出現した
    params:
      # プロセス終了後にダンプが書き出されるまで待つ時間
      wait_after_exit_sec: 5

  - id: C-03
    severity: critical
    title: 起動しない（boot なし）
    description: 起動から一定時間内に [YOMAWARI] boot 行が出ない
    on_detect: restart
    params:
      timeout_sec: 30

  - id: C-04
    severity: major
    title: 終了操作のあともプロセスが残る
    description: >-
      [guard.buttons] の expect_exit のボタン（タイトルの「終了」など）を押してから、一定時間たってもプロセスが終了しない。
      確認ダイアログが出るゲームでは、ダイアログの「はい」を expect_exit に書く
    on_detect: restart
    params:
      timeout_sec: 10

  - id: H-01
    severity: critical
    title: ハング（ハートビート途絶）
    description: プロセス生存中にハートビートが途絶えた（CPU使用率を付記）
    on_detect: restart
    params:
      timeout_sec: 10

  - id: L-01
    severity: major
    title: Error / Exception / Assert ログ
    description: >-
      ゲームの YomawariLog が Application.logMessageReceived から出す log_error イベント。
      Player.log の本文からは Log と Error を区別できないため、本文のパターンでは判定しない。
    params:
      types: [Error, Exception, Assert]
      # 誤検知になる既知のメッセージ（正規表現）。ゲームごとに追記する
      ignore_patterns: []

  - id: L-06
    severity: minor
    title: Warning ログ
    description: >-
      ゲームの YomawariLog が Application.logMessageReceived から出す log_warning イベント。
      エンジンが動きながら出す指定ミスの警告など、進行は止まらないが直したいものをレポートに載せる。
      動作に影響するかは分からないので Minor にする。
    params:
      # 誤検知になる既知のメッセージ（正規表現）。ゲームごとに追記する
      ignore_patterns: []
      # 文面に場所が入っている形式（script・line・message の名前付きグループ）。合わなければ直前の行を場所にする
      spot_patterns:
        - "^Scenario script '(?P<script>[^']+)' at line #(?P<line>[\\d.]+): (?P<message>.*)$"

  - id: S-01
    severity: critical
    title: 応答確認に反応しない
    description: >-
      イレギュラー操作のあと、次の通常の操作（本文送り・ボタン）で画面の状態が変わらない（ハートビートは生存）。
      画面の状態は scene・行ID・menu とボタンの並び・選択肢・暗転中かどうかで比べる（ボタンの矩形は比べない）。
      待っているあいだにスクリプトのコマンドが進んでいれば、本文のない演出の途中でゲームは止まっていないので出さない
    on_detect: restart
    params:
      timeout_sec: 5
      # ハートビートがこの秒数以内に来ていれば「生存」とみなす（途絶えていれば H-01 の担当）
      heartbeat_alive_sec: 3

  - id: S-02
    severity: critical
    title: 本文が進まない
    description: 本文を送るクリックを続けても line / choices / scene が来ない
    on_detect: restart
    params:
      # 反応のない本文送りは S-01 の timeout_sec（5 秒）ずつ待つので、10 回で約 50 秒。20 回（約 100 秒）では、
      # 進めなくなってから気づくまでが長すぎた（Rachel で、回想一覧を閉じて進めなくなってから 80 秒たっても出なかった）
      clicks: 10
      heartbeat_alive_sec: 3

  - id: S-03
    severity: critical
    title: 暗転・遷移が終わらない
    description: transition の開始から一定時間たっても終了が来ない
    on_detect: restart
    params:
      timeout_sec: 10

  - id: S-05
    severity: major
    title: ボタンを押しても反応しない
    description: >-
      前に反応した menu のボタン（矩形の中心）を押しても画面の状態が変わらない回が、同じボタンで続く。
      一度も反応したことのないボタン（ロック中のスロットなど）は数えず、レポートの「一度も反応しなかったボタン」に載せる。
      押した時点で暗い・文字で空と分かったボタン（セーブ画面では反応し、ロード画面では反応しない空のスロットなど）も数えない。
      押しても menu の並びが変わらない種類（トグル、ドロップダウンなど）は ignore_types で除く
    params:
      consecutive: 3
      heartbeat_alive_sec: 3
      # ボタンの種類（menu の type）。押しても並びが変わらないもの
      ignore_types: ["toggle", "dropdown", "slider", "input"]
      # "<menu>/<ボタン>" に対する正規表現。ゲーム固有のものはプロファイルの [rules.S-05] に書く。
      # 名前の既定値は、type を出さない古いパッケージのビルド向け。パッケージが type を出すようになったら消す
      ignore_patterns: ["Toggle", "Dropdown", "Slider"]

  - id: V-07
    severity: major
    title: 暗いボタンで別の画面に進める
    description: >-
      同じ画面で同じ種類に見えるボタン（同じ名前か同じ大きさ）の並びのうち、ほかより明らかに暗い（今は押せないように見える）
      ボタンを押したら、別の画面が出た（ボタンのある menu かモーダルが開いた・閉じた、scene が変わった）。
      見た目と動作の食い違い（アンロック前の回想が開けるなど）。押せないことを知らせる演出（震える、ボタンのない通知）は除く。
      押してセーブが始まったものも除く（空きのセーブスロットはサムネイルがなく暗く写るが、セーブするのが正しい操作）。
      対象は、押せないときの一般的な見せ方（半透明: fade_ratio、色を抜いた灰色: grey_ratio。yomawari.toml の [fuzz]）か、
      伏せ字（inactive_hints.masked、「？？？」）で押せないと見たボタン。ほかより暗いだけ（dim_ratio / dim_min_gap）では出さない
      （絵柄・サムネイルが暗いだけのことがあり、暗い＝押せないかはデザイン次第のため。押す順番を後回しにするのには使う）。
      DESIGN.md §9「画像による推定」
    params:
      heartbeat_alive_sec: 3

  # --- パフォーマンス（DESIGN.md §10「パフォーマンス」）。共通の設定は下の perf。閾値は実機で回しながら調整する ---

  - id: R-01
    severity: major
    title: メモリが増え続ける
    description: >-
      メモリ（metrics に書いた種類）の下限（bucket_sec 秒ごとの最小）が、min_span_sec 秒以上、前の下限から max_drop_mb より
      下がらずに、min_rise_mb 以上増え続けた（使い終わったメモリが解放されないまま増え続ける）。読み込みで増えても、あとで
      解放されて下限が戻るなら出さない（短いあいだの増減は見ない）。起動ごとに1回
    params:
      metrics: [rss, total]
      bucket_sec: 300
      min_span_sec: 3600
      min_rise_mb: 200
      max_drop_mb: 50

  - id: R-02
    severity: major
    title: FPS が低いまま続く
    description: 遷移中・起動や scene の直後以外で、FPS が min_fps 未満の状態が sec 秒以上続いた
    params:
      min_fps: 20
      sec: 10

  - id: R-03
    severity: major
    title: スレッド数が増え続ける
    description: window_sec 秒のあいだ、スレッド数が min_increase 以上増え、途中で max_drop より多く減らなかった
    params:
      window_sec: 600
      min_increase: 20
      max_drop: 2

  - id: R-04
    severity: major
    title: CPU 使用率が急に上がる
    description: >-
      ゲームの CPU 使用率（1 コアを 100%）が、そのランの中央値より add ポイント以上、かつ ratio 倍以上の状態で sec 秒以上続いた。
      遷移中・起動や scene の直後は除く
    params:
      add: 50
      ratio: 2.0
      sec: 3

  - id: R-05
    severity: major
    title: FPS がふだんより落ちたまま続く
    description: >-
      FPS が、そのランのふだんの値（中央値）より drop_ratio 以上落ちたまま sec 秒以上続いた。遷移中・起動や scene の直後は除く。
      GPU・CPU をどれだけ使っていても、FPS が落ちていなければ出さない（落ちたときの GPU・CPU は内容に書く）。ふだんの値は、
      サンプルが baseline_samples 個たまってから決める（ランの始めの一部の場面だけで決めない）。同じ落ち込みで R-02 にも
      当たるときは、R-05 の 1 件にする
    params:
      drop_ratio: 0.2
      sec: 5
      baseline_samples: 300

  - id: R-07
    severity: minor
    title: 同じところで重いフレームが出る
    description: >-
      frame_ms 以上かかったフレームが、同じ本文の行か、同じ演出のコマンドの attribute_sec 秒以内に repeats 回以上出た。
      遷移中・起動や scene・ロードの直後は除く。1 回の重いフレームは、当てはまる行・コマンドが複数あっても 1 件にする。
      重いフレームのあと fps_window_sec 秒の FPS の中央値が、ふだん（ランの中央値）より major_fps_drop_ratio 以上落ちていれば
      Major、そうでなければ Minor（1 フレームだけ詰まって、FPS はほとんど変わらない）
    params:
      frame_ms: 100
      attribute_sec: 2
      repeats: 2
      fps_window_sec: 3
      major_fps_drop_ratio: 0.2

  - id: R-08
    severity: major
    title: 演出のコマンドで重くなる
    description: >-
      同じコマンドと対象（@spawn Rain、@char Aoi など）の実行後 window_sec 秒の値が、実行前 window_sec 秒より悪い
      （FPS が fps_drop_ratio 以上落ちる、CPU 使用率が cpu_add ポイント以上上がる、GPU 使用率が gpu_add ポイント以上上がり
      FPS も gpu_fps_drop_ratio 以上落ちる）ことが、repeats 回以上あった。メモリの増減は見ない（R-01 で見る）。
      前後とも min_samples 個以上のサンプルがあるときだけ数える。前後のどちらかに、遷移中・ロード中・起動や scene の直後
      （perf.settle_sec）のサンプルがあれば数えない（切り替えの負荷と、コマンドの負荷を見分けられないため）。
      同じときに実行した複数のコマンドが同じ悪化に当たったら、
      いちばん大きく悪化したものの 1 件にまとめる
    params:
      window_sec: 3
      min_samples: 2
      fps_drop_ratio: 0.3
      cpu_add: 50
      gpu_add: 30
      gpu_fps_drop_ratio: 0.1
      repeats: 2

  - id: R-09
    severity: major
    title: ほかの場所より重い scene がある
    description: >-
      ランの終わりに、scene ごとの中央値をラン全体の中央値と比べる。FPS が fps_drop_ratio 以上低い、CPU 使用率が cpu_add ポイント
      以上高い、または GPU 使用率が gpu_add ポイント以上高く FPS も gpu_fps_drop_ratio 以上低い。サンプルが min_samples 個以上の
      scene だけ
    params:
      min_samples: 30
      fps_drop_ratio: 0.25
      cpu_add: 50
      gpu_add: 30
      gpu_fps_drop_ratio: 0.1

  - id: R-10
    severity: major
    title: 前回までのランより悪くなった
    description: >-
      ランの終わりに、scene ごとの値と、演出のコマンドごとの実行前後の差を、同じビルド名・同じマシンの前回までのラン
      （perf の history_runs 回）と比べる。FPS が ratio 以上落ちた、CPU・GPU 使用率が ratio 以上かつ cpu_add・gpu_add ポイント以上
      上がった（GPU は FPS も gpu_fps_drop_ratio 以上落ちたときだけ）。メモリは見ない（R-01 で見る）。
      コマンドは、今回と前回のどちらも min_cmd_runs 回以上実行したものだけ比べ、今回の変化そのものも悪い
      （FPS が ratio 以上落ちる、CPU・GPU が cpu_add・gpu_add ポイント以上上がる）ときだけ出す（1 回だけの実行や、
      下がっていたものが少し上がっただけのものは、ばらつきと区別できないため）
    params:
      ratio: 0.2
      cpu_add: 10
      gpu_add: 10
      gpu_fps_drop_ratio: 0.1
      min_samples: 30
      min_cmd_runs: 3

  - id: R-11
    severity: major
    title: GPU を使わずに CPU ばかり使う
    description: >-
      ゲームの CPU 使用率（1 コアを 100%）が cpu_min 以上、GPU 使用率が gpu_max 以下の状態で sec 秒以上続いた
      （描画以外の処理が重い）。遷移中・起動や scene の直後は除く
    params:
      cpu_min: 100
      gpu_max: 15
      sec: 10

  - id: R-12
    severity: minor
    title: 起動しているあいだに FPS が落ち、メモリも増えた
    description: >-
      起動ごとに、起動し始め（計り始めて start_sec 秒たってからの bucket_sec 秒）と終わり（終わりの end_sec 秒）を比べ、
      FPS の中央値が fps_drop_ratio 以上落ち、メモリ（metrics に書いた種類）の下限も min_rise_mb 以上増えていた。メモリの
      終わりの値は、終わりの end_sec 秒にかかる bucket_sec 秒ごとの最小のうち、いちばん低いもの（途中で増えても、終わりまでに
      解放されて下がっていれば増えたとしない）。メモリが増えただけでは出さない（遊ぶ人に見える影響がない。下限が下がらずに
      増え続けるものは R-01 で見る）。FPS は遷移中・起動や scene の直後を除く。起動していた時間が min_span_sec 秒より短い
      起動は見ない。ランの終わりに、起動ごとに1回判定する
    params:
      metrics: [total]
      start_sec: 300
      bucket_sec: 300
      end_sec: 900
      min_span_sec: 1800
      fps_drop_ratio: 0.1
      min_rise_mb: 200

# パフォーマンスの判定（R-01〜R-12。R-06 は欠番）で共通の設定
perf:
  # 起動（boot）してからこの秒数は計らない（読み込み・シェーダーのコンパイル）
  warmup_sec: 30
  # scene が変わった・遷移が終わった・ロードが終わったあと、この秒数はふだんの値と比べない
  settle_sec: 3
  # 中央値（ふだんの値）を基準にするのに要るサンプル数
  min_samples: 30
  # R-10 で比べる、前回までのランの数
  history_runs: 5
  # ゲーム以外が原因と見なして判定から外すとき。ゲームの CPU・GPU はプロセス単位なので other_* では外さない
  exclude:
    # マシン全体の CPU（全コアに対する %）のうち、ゲーム以外が使っている分
    other_cpu_percent: 50
    # GPU 全体の使用率のうち、ゲーム以外が使っている分
    other_gpu_percent: 40
    # 熱の状態（nominal / fair / serious / critical）がこれ以上
    thermal: serious
    # メモリの逼迫度（normal / warning / critical）がこれ以上
    pressure: warning
    # 60 秒でスワップがこれ以上増えた
    swap_growth_mb: 100
    # 計測の間隔がこの秒数以上空いたら（スリープ）、そのあと after_gap_sec 秒外す
    gap_sec: 5
    after_gap_sec: 30

# ボタンの役割を、押す前にボタンの文字（menu の text）と名前（GameObject 名）から推定するキーワード（DESIGN.md §9「役割の推定と判定」）。
# ゲームごとではなく yomawari 全体で共通に持つ（ゲームのプロファイルには書かない）。
# - text: 英数字の語は単語として（大文字小文字を区別しない）、日本語などは部分一致で照らし合わせる
# - name: 名前を CamelCase・_・空白・数字で区切った語の並びと照らし合わせる（"to title" は "ToTitleMenu" に当たり、"TitleWebSite" には当たらない）
# 文字で決まればそれを使い、なければ名前で決める。複数の役割に当てはまれば推定しない。
# 推定は押し方を決めるだけで、役割は押した結果で確定する（外れていれば取り消す）。
role_hints:
  exit:
    text: ["終了", "Quit", "Exit"]
    name: ["quit", "exit"]
  external:
    text: ["Webサイト", "WEBサイト", "ウェブサイト", "公式サイト", "ホームページ", "Website", "Web Site", "Twitter", "Discord", "Steam"]
    name: ["website", "web site", "homepage", "url", "link", "browser", "twitter", "discord"]
  to_title:
    text: ["タイトルへ", "タイトルに戻る", "タイトル画面", "Title", "Main Menu"]
    name: ["to title", "back to title", "main menu"]
  system_setting:
    text: ["フルスクリーン", "ウィンドウモード", "解像度", "画面モード", "言語", "画質", "Fullscreen", "Windowed", "Resolution", "Screen Mode", "Language", "Graphics"]
    name: ["resolution", "fullscreen", "full screen", "screen mode", "window mode", "language", "graphics"]
  new_game:
    text: ["はじめから", "最初から", "ニューゲーム", "New Game"]
    name: ["new game"]
  deny:
    text: ["購入", "課金", "ショップ", "投稿", "シェア", "ツイート", "Buy", "Purchase", "Shop", "Share", "Tweet"]
    name: ["purchase", "buy", "shop", "share", "tweet"]

# 押しても何も起きないことが文字で分かるボタン（空のセーブ・ロードのスロットなど）の語（DESIGN.md §9「画像による推定」）。
# 当てはまるボタンは、暗いボタンと同じく押す順番を後回しにする（押さなくはしない。セーブ画面では空きにセーブするのが正しいため）。
# 英数字の語は単語として（大文字小文字を区別しない）、日本語などは部分一致で照らし合わせる
inactive_hints:
  text: ["Empty", "No Data", "NO DATA", "空き", "データなし", "未使用"]
  # 伏せ字の文字。文字が（空白を除いて）これだけでできているボタン（「？？？」）は、まだ開いていないものとみなして後回しにする。
  # 並びに伏せ字のボタンがあれば、その並びは明るさではなく文字で押せるかを決める（サムネイルの絵が暗いだけで開いているものが
  # あるため）。伏せ字のボタンは暗いボタンと同じく V-07 の対象、文字を読めて伏せ字でないボタンは暗くても V-07 の対象にしない
  masked: ["?", "？"]

# セーブ済みのスロット・続きから遊ぶボタン・ページを送るボタン・セーブするボタン（DESIGN.md §9「続きから遊ぶ」「終了を試す前にセーブする」）。
# ラン中にゲームを起動し直したら、人がするように「続きから」を選び、いちばん新しいセーブをロードする（見えているスロットが
# どれも空ならページを送って探す）。本編を進めるあいだは、セーブ済みのスロットを後回しにする（古いセーブに戻らない）。
# - stamp: セーブ済みのスロットの文字（日時）。正規表現
# - resume / next_page: text はボタンの文字、name はボタンの名前と照らし合わせる（role_hints と同じ照らし合わせ方）
save_hints:
  stamp: ['\d{1,2}\s*[:：]\s*\d{2}']
  resume:
    text: ["続きから", "つづきから", "コンティニュー", "Continue", "Load", "ロード"]
    # 名前の "load" は、セーブとロードを兼ねたスロット（SaveLoadSlot）にも当たるので入れない
    name: ["continue"]
  next_page:
    text: [">", "＞", "次へ", "次のページ", "Next"]
    name: ["next"]
  # セーブするボタン（右クリックメニューの「Save」、セーブ画面のセーブのタブなど）。終了ボタンを試す前にセーブするときに使う
  save:
    text: ["セーブ", "Save"]
    name: ["save"]
