# Yomawari 検出ルール（DESIGN.md §10）
# 閾値・パターン・検出時の動作はここに置き、コードには書かない。
# 実装済みのルールだけを並べる。未実装のルールはフェーズごとに追加する。
#
# severity: critical | major | minor | info
# on_detect: restart（ゲームを止めて再起動し継続）| 省略（記録のみ）

version: 1

rules:
  - id: C-01
    severity: critical
    title: プロセスの異常終了
    description: ハーネスが終了させていないのにプロセスが消滅した、または終了コードが0以外
    on_detect: restart
    params:
      # ハーネスが送ったシグナルによる終了コード（負値はシグナル番号）は異常扱いしない
      harness_exit_codes: [0, -15, -9]

  - id: C-02
    severity: critical
    title: クラッシュダンプの出現
    description: 起動後にクラッシュダンプフォルダへゲームのダンプが出現した
    params:
      # プロセス終了後にダンプが書き出されるまで待つ時間
      wait_after_exit_sec: 5

  - id: C-03
    severity: critical
    title: 起動しない（boot なし）
    description: 起動から一定時間内に [YOMAWARI] boot 行が出ない
    on_detect: restart
    params:
      timeout_sec: 30

  - id: C-04
    severity: major
    title: 終了操作のあともプロセスが残る
    description: >-
      [guard.buttons] の expect_exit のボタン（タイトルの「終了」など）を押してから、一定時間たってもプロセスが終了しない。
      確認ダイアログが出るゲームでは、ダイアログの「はい」を expect_exit に書く
    on_detect: restart
    params:
      timeout_sec: 10

  - id: H-01
    severity: critical
    title: ハング（ハートビート途絶）
    description: プロセス生存中にハートビートが途絶えた（CPU使用率を付記）
    on_detect: restart
    params:
      timeout_sec: 10

  - id: L-01
    severity: major
    title: Error / Exception / Assert ログ
    description: >-
      ゲームの YomawariLog が Application.logMessageReceived から出す log_error イベント。
      Player.log の本文からは Log と Error を区別できないため、本文のパターンでは判定しない。
    params:
      types: [Error, Exception, Assert]
      # 誤検知になる既知のメッセージ（正規表現）。ゲームごとに追記する
      ignore_patterns: []

  - id: S-01
    severity: critical
    title: 応答確認に反応しない
    description: >-
      イレギュラー操作のあと、次の通常の操作（本文送り・ボタン）で画面の状態が変わらない（ハートビートは生存）。
      画面の状態は scene・行ID・menu とボタンの並び・選択肢・暗転中かどうかで比べる（ボタンの矩形は比べない）
    on_detect: restart
    params:
      timeout_sec: 5
      # ハートビートがこの秒数以内に来ていれば「生存」とみなす（途絶えていれば H-01 の担当）
      heartbeat_alive_sec: 3

  - id: S-02
    severity: critical
    title: 本文が進まない
    description: 本文を送るクリックを続けても line / choices / scene が来ない
    on_detect: restart
    params:
      clicks: 20
      heartbeat_alive_sec: 3

  - id: S-03
    severity: critical
    title: 暗転・遷移が終わらない
    description: transition の開始から一定時間たっても終了が来ない
    on_detect: restart
    params:
      timeout_sec: 10

  - id: S-05
    severity: major
    title: ボタンを押しても反応しない
    description: >-
      前に反応した menu のボタン（矩形の中心）を押しても画面の状態が変わらない回が、同じボタンで続く。
      一度も反応したことのないボタン（ロック中のスロットなど）は数えず、レポートの「一度も反応しなかったボタン」に載せる。
      押しても menu の並びが変わらない種類（トグル、ドロップダウンなど）は ignore_types で除く
    params:
      consecutive: 3
      heartbeat_alive_sec: 3
      # ボタンの種類（menu の type）。押しても並びが変わらないもの
      ignore_types: ["toggle", "dropdown", "slider", "input"]
      # "<menu>/<ボタン>" に対する正規表現。ゲーム固有のものはプロファイルの [rules.S-05] に書く。
      # 名前の既定値は、type を出さない古いパッケージのビルド向け。パッケージが type を出すようになったら消す
      ignore_patterns: ["Toggle", "Dropdown", "Slider"]

# ボタンの役割を、押す前にボタンの文字（menu の text）と名前（GameObject 名）から推定するキーワード（DESIGN.md §9「役割の推定と判定」）。
# ゲームごとではなく yomawari 全体で共通に持つ（ゲームのプロファイルには書かない）。
# - text: 英数字の語は単語として（大文字小文字を区別しない）、日本語などは部分一致で照らし合わせる
# - name: 名前を CamelCase・_・空白・数字で区切った語の並びと照らし合わせる（"to title" は "ToTitleMenu" に当たり、"TitleWebSite" には当たらない）
# 文字で決まればそれを使い、なければ名前で決める。複数の役割に当てはまれば推定しない。
# 推定は押し方を決めるだけで、役割は押した結果で確定する（外れていれば取り消す）。
role_hints:
  exit:
    text: ["終了", "Quit", "Exit"]
    name: ["quit", "exit"]
  external:
    text: ["Webサイト", "WEBサイト", "ウェブサイト", "公式サイト", "ホームページ", "Website", "Web Site", "Twitter", "Discord", "Steam"]
    name: ["website", "web site", "homepage", "url", "link", "browser", "twitter", "discord"]
  to_title:
    text: ["タイトルへ", "タイトルに戻る", "タイトル画面", "Title", "Main Menu"]
    name: ["to title", "back to title", "main menu"]
  system_setting:
    text: ["フルスクリーン", "ウィンドウモード", "解像度", "画面モード", "言語", "画質", "Fullscreen", "Windowed", "Resolution", "Screen Mode", "Language", "Graphics"]
    name: ["resolution", "fullscreen", "full screen", "screen mode", "window mode", "language", "graphics"]
  new_game:
    text: ["はじめから", "最初から", "ニューゲーム", "New Game"]
    name: ["new game"]
  deny:
    text: ["購入", "課金", "ショップ", "投稿", "シェア", "ツイート", "Buy", "Purchase", "Shop", "Share", "Tweet"]
    name: ["purchase", "buy", "shop", "share", "tweet"]
