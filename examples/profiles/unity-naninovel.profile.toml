# Unity + Naninovel のゲームのプロファイルの例（Rachel を想定）
# 仕様: DESIGN.md §9「ゲーム固有の仕様」③。考え方は examples/profiles/README.md
#
# ゲームのコードには何も足さない。ボタンの役割や押せない条件は、プロファイルにも書かない。
#   - Naninovel の標準の部品（終了・タイトルへ・設定のドロップダウンなど）→ パッケージが自動で読み取る（①）
#   - 自作の終了ボタン・Web サイトのボタン・タイトルへ戻るボタン → ハーネスが文字・名前（見た目は未実装）から推定し、押した結果で確定する（②）
#   - 劇中でアンロックされるまで押せない回想のスロット → 押しても反応しないボタンとして、ハーネスが後回しにし、S-05 の対象にしない（②）
#   - 回想一覧の ScrollRect → パッケージが hidden / scroll を出し、ハーネスがドラッグ・方向キーを試す

[guard.roles]
# 役割ごとの区分を、既定値（DESIGN.md §9 ガード）から変えるときだけ書く。
# to_title = "normal"           # 例: タイトルへ戻るのも通常の操作として押す

[guard.buttons]
# 推定も確定もできないうちに押してはいけないもの（課金、データの送信など）だけ、"<menu の name>/<ボタンの name>" で書く。
# deny = ["TitleUI/ShopButton"]

[screens.MemoryListUI]
# 回想一覧。ボタンが多く、総当たりに時間がかかるので、ほかの画面より押されにくくする
weight = 0.5

[rules.L-01]
# 既知で無害なエラー。直したら消す
ignore_patterns = []

# ゲームの流れ（DESIGN.md §9「ゲームの流れ」）。遊び方のサイクルを、どの画面で何をすると次に進むかで書く
[[flow]]
name = "質問に言葉で答える"
start = { screen = "MemoryListUI", by = "game" }            # ゲームが思い出の一覧を開いたら（本編の質問）
avoid = ["MemoryListUI/SelectButton", "MemorySummaryUI/CloseMemorySummary", "MemoryScenarioPlaying/OpenDialog"]
steps = [
  { screen = "MemoryListUI", press = "MemoryListGridSlot*", note = "開示済みの思い出を選ぶ" },
  { screen = "MemorySummaryUI", press = "StartToMemoryScenario", once = true, note = "この思い出を読む" },
  { scene = "memories/*", advance = true, once = true, note = "思い出を最後まで読む（言葉が開示される）" },
  { screen = "MemorySummaryUI", press = "ShowFragmentListButton", note = "言葉を選ぶ" },
  { screen = "MemoryFragmentListUI", press = "MemoryFragmentListSlot*", note = "開示済みの言葉を選ぶ" },
  { screen = "MemoryFragmentUI", press = "ShowDialogButton", note = "この言葉で答える" },
  { screen = "FragmentSelectDialogUI", press = "Accept", note = "答えを決める" },
]

# 質問ごとの正解（DESIGN.md §9「答えの選び方」）。書かなくてもよい（AI に順位を付けさせて試し、見つけた正解をハーネスが覚える）。
# 使うかはランの目的で決まる（play: 使う。ときどきわざと外れも答える / rta: 使い、外れは答えない / stuck: 使わない）
#   at:   質問の本文の行（line_id。events.jsonl の line や report.md の「場所」に出る。ワイルドカード可）
#   pick: 選ぶ手順（上の steps のうち、ワイルドカードで書いたボタン。once の手順は数えない）ごとに、選ぶものの画面に見える文字
#         （思い出 → 言葉の順。空白を除いて比べる。ワイルドカード可。ボタン名の番号 #n はビルドで変わるので使わない）
# 下の値は書き方の例で、正解かどうかは確かめていない
[[flow.answers]]
at = "main/scenarioA_004:44.0"
pick = ["No.050*", "屋上"]
note = "例"

[[flow]]
name = "選択肢で答える"
start = { choices = true }
steps = [{ choose = true, note = "選択肢を選ぶ" }]

# 選択肢の正解は、選択肢の本文で書く
[[flow.answers]]
at = "ending/badend_902:71.0"
pick = ["レイチェルに話す"]
note = "例"
