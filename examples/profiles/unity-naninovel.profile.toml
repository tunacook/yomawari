# Unity + Naninovel のゲームのプロファイルの例（Rachel を想定）
# 仕様: DESIGN.md §9「ゲーム固有の仕様」③。考え方は examples/profiles/README.md
#
# ゲームのコードには何も足さない。ボタンの役割や押せない条件は、プロファイルにも書かない。
#   - Naninovel の標準の部品（終了・タイトルへ・設定のドロップダウンなど）→ パッケージが自動で読み取る（①）
#   - 自作の終了ボタン・Web サイトのボタン・タイトルへ戻るボタン → ハーネスが文字・名前（見た目は未実装）から推定し、押した結果で確定する（②）
#   - 劇中でアンロックされるまで押せない回想のスロット → 押しても反応しないボタンとして、ハーネスが後回しにし、S-05 の対象にしない（②）
#   - 回想一覧の ScrollRect → パッケージが hidden / scroll を出し、ハーネスがドラッグ・方向キーを試す

[guard.roles]
# 役割ごとの区分を、既定値（DESIGN.md §9 ガード）から変えるときだけ書く。
# to_title = "normal"           # 例: タイトルへ戻るのも通常の操作として押す

[guard.buttons]
# 推定も確定もできないうちに押してはいけないもの（課金、データの送信など）だけ、"<menu の name>/<ボタンの name>" で書く。
# deny = ["TitleUI/ShopButton"]

[screens.MemoryListUI]
# 回想一覧。ボタンが多く、総当たりに時間がかかるので、ほかの画面より押されにくくする
weight = 0.5

[rules.L-01]
# 既知で無害なエラー。直したら消す
ignore_patterns = []
