# Yomawari の設定例。yomawari.toml にコピーして使う（yomawari.toml はコミットしない）
# 相対パスはこのファイルのあるディレクトリが基準

default_build = "mac_dev"
# runs_dir = "runs"
# rules = "rules.yaml"

[builds.mac_dev]
path = "~/Builds/Rachel_Dev/Rachel.app"
args = ["-screen-fullscreen", "0", "-screen-width", "1280", "-screen-height", "720"]
watermark_mask = { anchor = "bottom-right", w = 220, h = 40 }   # Development Build の透かし（フェーズ3〜）
# セーブと PlayerPrefs の場所は Info.plist の CFBundleIdentifier（バンドルID）から決める。外れる場合は明示する
# save_dir = "~/Library/Application Support/com.MyCompany.Rachel"
# prefs_domain = "com.MyCompany.Rachel"
# initial_save = "fixtures/saves/start"        # テスト用初期セーブ（ラン前に配置）

[run]
hours = 8
seed = "auto"
open_report = true
keep_runs_days = 14
max_restarts = 20            # これを超えたらランを打ち切る
quit_timeout_sec = 10        # 終了要求から強制終了までの待ち時間

[sensors]
log_poll_sec = 0.1           # Player.log を読みに行く間隔
log_flush_sec = 0.5          # 新しい行が来ないとき保留中のログエントリを確定するまでの時間
process_poll_sec = 1.0
crash_poll_sec = 2.0
tick_sec = 0.5               # タイムアウト系ルールを評価する間隔

[expect]                      # Player Settings の期待値（判定に使う。フェーズ3〜）
run_in_background = false
resizable_window = true
allow_fullscreen_switch = true

[exclude]
dark_labels = ["ch1_blackout"]   # 意図的な暗転・長い静止演出（フェーズ3〜）

[guard.buttons]               # 押したあとの扱い（DESIGN.md §9）。"<menu>/<ボタン>" は yomawari inspect で調べる
expect_exit = []              # 押すと終了するボタン。終了コード 0 で終わるかを確かめ、再起動して続ける
external = []                 # ブラウザなどを開くボタン。1回のランで1回だけ押す
irregular_only = []           # タイトルへ戻る、解像度・言語の変更など。fuzz のイレギュラー操作のときだけ押す
deny = []                     # 押さない（課金、データの送信など）
# 例: expect_exit = ["TitleUI/QuitButton", "RClickMenuUI/ToExit"]

[fuzz]
op_interval_sec = 0.5         # 通常の操作の間隔
settle_sec = 0.5              # 画面が変わってから次の操作までに待つ時間
advance_point = [0.5, 0.5]    # 本文送り・右クリック・ホイールの位置（描画領域の正規化座標）
trigger_prob = 0.3            # fuzz: きっかけのイベントでイレギュラー操作を差し込む確率
trigger_delay_max_sec = 0.5   # きっかけから差し込むまでの遅延の上限
irregular_prob = 0.05         # fuzz: 通常の操作の代わりにイレギュラー操作をする確率
rapid_count = 10              # 連打の回数
stuck_modal_sec = 5           # ボタンのないモーダルがこの時間残ったら、Esc・右クリックで抜けようとする
external_wait_sec = 3         # external のボタンを押してから前面を確かめるまで
exit_min_interval_sec = 1800  # expect_exit のボタンを押す間隔の下限
no_response_factor = 0.2      # 押して反応がなかった操作の重みに、反応がなかった回数だけ掛ける（同じ状態で後回しにする）
drag_distance = 0.3           # モーダルな画面でドラッグする距離（描画領域の幅・高さに対する割合）

[fuzz.weights]                # 通常の操作の重み
advance = 20
right_click = 1
wheel_up = 1
click = 5                     # ボタン・選択肢を押す（ボタンがいくつあっても、まとめてこの重み。まだ押していないものから選ぶ）
move = 2                      # モーダルな画面を動かす（ドラッグ・ホイール・方向キー・Enter）
leave = 1                     # モーダルな画面を抜ける（Esc・右クリック）

[decider]
kind = "random"              # random（local / jev はフェーズ7）
model = ""

[judge]
kind = "local"               # local | none（フェーズ5〜）
endpoint = "http://localhost:11434"
model = "<画像対応モデル名:タグ>"
