# Yomawari の設定例。yomawari.toml にコピーして使う（yomawari.toml はコミットしない）
# 相対パスはこのファイルのあるディレクトリが基準

default_build = "mac_dev"
# runs_dir = "runs"
# rules = "rules.yaml"

[builds.mac_dev]
path = "~/Builds/Rachel_Dev/Rachel.app"
args = ["-screen-fullscreen", "0", "-screen-width", "1280", "-screen-height", "720"]
watermark_mask = { anchor = "bottom-right", w = 220, h = 40 }   # Development Build の透かし（フェーズ3〜）
# セーブと PlayerPrefs の場所は Info.plist の CFBundleIdentifier（バンドルID）から決める。外れる場合は明示する
# save_dir = "~/Library/Application Support/com.MyCompany.Rachel"
# prefs_domain = "com.MyCompany.Rachel"
# initial_save = "fixtures/saves/start"        # テスト用初期セーブ（ラン前に配置）
# profile = "~/work/Rachel/yomawari.profile.toml"  # ゲームのプロファイル（ゲームのリポジトリでコミットするもの）

[run]
hours = 8
purpose = "play"             # ランの目的（--purpose で変えられる）。play / stuck / buttons / gacha / rta / aging（README「使い方」）
seed = "auto"
open_report = true
keep_runs_days = 14
max_restarts = 20            # これを超えたらランを打ち切る
quit_timeout_sec = 10        # 終了要求から強制終了までの待ち時間
display_off = false          # ゲームが起動したあと、画面を消す（macOS: pmset displaysleepnow）。--display-off
display_off_delay_sec = 10   # ゲームが起動してから画面を消すまでの時間

# ランの目的を変える・足す（yomawari/purpose.py の組み込みの目的に重ねる）。fuzz は [fuzz] の上書き
# [purpose.stuck]
# focus = ["S-02", "S-03"]                 # レポートで深刻度ごとに先に並べるルール
# [purpose.stuck.fuzz]
# recover_ops = 8                          # 進めなくなったら、再起動の前に抜け出す操作を試す
# [purpose.saveload]                       # 新しい目的
# description = "セーブとロードを繰り返す"
# mode = "random"
# fuzz = { intent_explore = 1, weights = { right_click = 5 } }
# [purpose.gacha.burst]                    # 通常のプレイの途中で、初めて来た画面・scene でときどき切り替える区間
# sec = 120                                # 区間の長さ（秒）
# prob = 0.5                               # 初めて来た地点で区間を始める確率
# share = 0.5                              # ランのうち区間に使ってよい割合
# [purpose.gacha.burst.fuzz]               # 区間の [fuzz] の上書き（mode / intent も書ける）
# irregular_prob = 0.5

[sensors]
log_poll_sec = 0.1           # Player.log を読みに行く間隔
log_flush_sec = 0.5          # 新しい行が来ないとき保留中のログエントリを確定するまでの時間
process_poll_sec = 1.0
crash_poll_sec = 2.0
tick_sec = 0.5               # タイムアウト系ルールを評価する間隔

[expect]                      # Player Settings の期待値（判定に使う。フェーズ3〜）
run_in_background = false
resizable_window = true
allow_fullscreen_switch = true

[exclude]
dark_labels = ["ch1_blackout"]   # 意図的な暗転・長い静止演出（フェーズ3〜）

# ゲーム固有の仕様（[guard.roles]・[guard.buttons]・[screens.<menu>]・[rules.<ID>]）は、ふつうはゲームのリポジトリの
# yomawari.profile.toml に書き、[builds.<名前>] profile で参照する（DESIGN.md §9「ゲーム固有の仕様」③）。
# ここに書いたものは、プロファイルの上に重なる（配列は足し合わせ、それ以外は上書き）

[guard.roles]                 # ボタンの役割（menu の role）ごとの扱い。"normal" は通常の操作
exit = "expect_exit"
external = "external"
to_title = "irregular_only"
system_setting = "irregular_only"
new_game = "normal"
deny = "deny"

[guard.buttons]               # role を出せないボタンだけ、名前で指定する。"<menu>/<ボタン>" は yomawari inspect で調べる
expect_exit = []              # 押すと終了するボタン。終了コード 0 で終わるかを確かめ、再起動して続ける
external = []                 # ブラウザなどを開くボタン。1回のランで1回だけ押す
irregular_only = []           # タイトルへ戻る、解像度・言語の変更など。fuzz のイレギュラー操作のときだけ押す
deny = []                     # 押さない（課金、データの送信など）
# 例: expect_exit = ["TitleUI/QuitButton", "RClickMenuUI/ToExit"]

[fuzz]
op_interval_sec = 0.5         # 通常の操作の間隔
settle_sec = 0.5              # 画面が変わってから次の操作までに待つ時間
advance_point = [0.5, 0.5]    # 本文送り・右クリック・ホイールの位置（描画領域の正規化座標）
trigger_prob = 0.3            # fuzz: きっかけのイベントでイレギュラー操作を差し込む確率
trigger_delay_max_sec = 0.5   # きっかけから差し込むまでの遅延の上限
irregular_prob = 0.05         # fuzz: 通常の操作の代わりにイレギュラー操作をする確率
rapid_count = 10              # 連打の回数
stuck_modal_sec = 5           # ボタンのないモーダルがこの時間残ったら、Esc・右クリックで抜けようとする
external_wait_sec = 3         # external のボタンを押してから前面を確かめるまで
exit_min_interval_sec = 1800  # expect_exit のボタンを押す間隔の下限
exit_interval_ratio = 0.25    # 長いランでは、expect_exit の間隔をランの長さのこの割合以上にする（8 時間なら 2 時間）。0 で無効
no_response_factor = 0.2      # 押して反応がなかった操作の重みに、反応がなかった回数だけ掛ける（同じ状態で後回しにする）
drag_distance = 0.3           # モーダルな画面でドラッグする距離（描画領域の幅・高さに対する割合）
role_window_sec = 5           # ボタンを押してからこの時間内に起きたこと（終了・タイトル・解像度など）で、そのボタンの役割を確定する
dim_ratio = 0.6               # 同じ種類に見えるボタンの並びで、いちばん明るいもののこの倍より暗いものを「暗い」とする
dim_min_gap = 0.1             # 明るさ（0〜1）の差がこれ未満なら暗いとしない
fade_ratio = 0.6              # 明るさで差がない並びで、濃淡と鮮やかさのどちらも、いちばん大きいもののこの倍より小さいものを「半透明に見える」とし、暗いものと同じに扱う
fade_min_gap = 0.05           # 濃淡・鮮やかさ（0〜1）の差がこれ未満なら半透明・灰色としない
grey_ratio = 0.3              # 明るさで差がない並びで、鮮やかさがいちばん大きいもののこの倍より小さいものを「色を抜いた（灰色）」とし、暗いものと同じに扱う
behind_ratio = 0.6            # 手前にあったときと比べてこの倍より暗い（明るい）ボタンを「見た目が変わった」とする（§9「手前の画面を見た目で判定する」）
behind_min_gap = 0.02         # 明るさの差がこれ未満なら変わったとしない（暗幕は暗いボタンも暗くするので小さく取る）
behind_share = 0.6            # 同じ位置のボタンのうち、この割合以上の見た目が変わった画面を、後ろに下がったとみなす
behind_move_ratio = 0.15      # 位置のずれがボタンの幅・高さのこの倍以内なら、同じ位置のボタンとして比べる（開いたあとの小さな動き）
dim_factor = 0.05             # 暗いボタン・文字で空と分かるボタン（"Empty" など）を押す重みに掛ける（後回しにする）。1 で無効
new_bright_factor = 20        # 前に見たときは暗かったのに明るくなったボタン（新しくアンロックされたもの）の重みに掛ける
explore_factor = 3            # 見えている並びがどれも押せそうにない、または明るさに差がなくどれを押せばよいか分からないとき、画面の外を探す操作の重みに掛ける（押して確かめる前に一覧を見て回る）
hover_wait_sec = 0.3          # 明るさを測る前に、カーソルをボタンのない場所へ動かしてから待つ時間
blocked_wait_sec = 5          # 画面のロックなどで OS が入力を受け付けないとき、次に試すまで待つ時間
blocked_note_sec = 30         # これより長く入力を受け付けなかったときだけ「ハーネスの記録」に書く
ai_choice = true              # 流れの手順で選ぶもの（言葉・思い出・選択肢）を、本文の文脈から AI（[judge]）に点数を付けさせて先に試す
ai_choice_factor = 5          # AI がいちばん合うと答えた候補の重みに掛ける
ai_context_lines = 20         # AI に渡す、質問の前の本文の行数
ai_timeout_sec = 60           # AI の答えを待つ時間（裏で待つので、操作は止めない）
read_text = true              # ボタンの文字を画面から読む（OCR）
read_text_min_conf = 0.3      # 読んだ文字の確からしさ（0〜1）がこれより低ければ使わない
quiet_wait_sec = 1            # 暗い・空のボタン、押しても一度も反応しなかったボタン（反応しないと見込んでいるもの）を押したあと、反応を待つ時間
search_factor = 1             # まだ見ていないボタンが画面の外にある向きへ動かす操作の重み（click × 画面の重み × これ）
return_factor = 3             # 前に見て明るかった（開示済みと分かっている）ボタンが画面の外にあるとき、そこへ戻る操作の重み（click × 画面の重み × これ）
search_give_up = 6            # その向きへ動かしても続けてこの回数反応しなければ、動かせないとみなしてやめる
blind_search_limit = 30       # ゲームが開いた画面で、見えているものがどれも押せないとき、向きを決めずに探す回数の上限
progress_window_sec = 3       # 押してからこの時間内に、まだ見ていない本文・scene・選択肢に届いたら「進行につながった」（§9「経験の蓄積」）
progress_bonus = 5            # random モードで、押すといつも進行につながる操作の重みに掛ける（割合に応じて 1〜この値）
rewind_factor = 0.1           # random モードで、押すといつもロード・タイトル戻りで巻き戻す操作の重みに掛ける（割合に応じて 1〜この値）
intent_progress = 3           # random モードで、プレイの目的「本編を進める」を選ぶ重み（起動したとき・タイトルに戻ったときに選ぶ。最初のプレイはこれ）
intent_explore = 1            # random モードで、プレイの目的「画面を見て回る」を選ぶ重み
progress_detour_factor = 0.2  # 目的が「本編を進める」のとき、寄り道を始める操作（本文中の右クリック・ホイール上・操作のボタン）の重みに掛ける
explore_detour_factor = 3     # 目的が「画面を見て回る」のとき、寄り道を始める操作の重みに掛ける
recover_ops = 8               # S-02 / S-03 のとき、再起動する前に抜け出す操作（Esc・右クリック・本文送り・ボタン）を試す回数
move_wait_sec = 1             # 一覧を動かす操作（ドラッグ・ホイール・方向キー）の反応を待つ時間。応答確認では S-01 の時間まで待つ
learn = true                  # random モードで、進め方の経験（進行につながった操作を優先する）を使う。ランの目的で変える
use_flow = true               # ゲームの流れ（プロファイルの [[flow]]）に沿って進める。ランの目的で変える（§9「ゲームの流れ」）
flow_factor = 20              # 流れのいまの手順で押すボタン・本文送り・選択肢の重みに掛ける
flow_avoid_factor = 0.02      # 流れの途中で押すと流れから外れるボタン（avoid）の重みに掛ける
flow_idle_sec = 10            # 流れのどの画面・scene でもない状態がこれだけ続いたら、流れが途切れたとする

[fuzz.weights]                # 通常の操作の重み
advance = 20
right_click = 1
wheel_up = 1
click = 5                     # ボタン・選択肢を押す（ボタンがいくつあっても、まとめてこの重み。まだ押していないものから選ぶ）
move = 2                      # モーダルな画面を動かす（ドラッグ・ホイール・方向キー・Enter）
leave = 1                     # モーダルな画面を抜ける（Esc・右クリック）

[decider]
kind = "random"              # random（local / jev はフェーズ7）
model = ""

[judge]
kind = "local"               # local | none（フェーズ5〜）
endpoint = "http://localhost:11434"
model = "qwen2.5vl:7b"       # 画像対応モデル（README の環境構築 7 で ollama pull したもの）
